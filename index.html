<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="calculator">
    <div class="display">
      <p class="previous"></p>
      <p class="current">0</p>
    </div>
    <div class="buttons">
      <button data-number="1" value="1">1</button>
      <button data-number="2" value="2">2</button>
      <button data-number="3" value="3">3</button>
      <button data-number="4" value="4">4</button>
      <button data-number="5" value="5">5</button>
      <button data-number="6" value="6">6</button>
      <button data-number="7" value="7">7</button>
      <button data-number="8" value="8">8</button>
      <button data-number="9" value="9">9</button>
      <button data-number="0" value="0">0</button>
      <button data-point="." value=".">.</button>
      <button data-action="C">C</button>
      <button data-action="del">del</button>
      <button data-operator="+">+</button>
      <button data-operator="-">-</button>
      <button data-operator="/">/</button>
      <button data-operator="*">*</button>
      <button data-action="=">=</button>

    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
